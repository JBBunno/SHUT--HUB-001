
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shutdown Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" />
<style>
  :root {
    --navy: #0d1e35;
    --navy-light: #16304f;
    --blue: #1f4e79;
    --gold: #e89820;
    --gold-dark: #c8821a;
    --ink: #1a2430;
    --muted: #6b7686;
    --border: #e2e6ec;
    --surface: #ffffff;
    --page: #0a1a30;
    --on-dark-muted: #93a5bd;
    --on-dark-faint: #5a6c85;

    --row-planning: #eef3f8;
    --row-planning-text: #17324f;
    --row-preparation: #e7edf5;
    --row-preparation-text: #14263f;
    --row-execution: #fdf3e2;
    --row-execution-text: #6b4a0c;
    --row-post: #eef1f5;
    --row-post-text: #2b3947;
    --row-safety: #fbeceb;
    --row-safety-text: #7a2c22;

    --glow-planning: #4f9fe0;
    --glow-preparation: #2fc4c4;
    --glow-execution: #e0a83f;
    --glow-post: #9aa6b5;
    --glow-safety: #e0564f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 30% 0%, #14202f 0%, #0a0f18 55%, #060a10 100%);
    font-family: 'Calibri Light', 'Calibri', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 300;
    color: var(--ink);
  }

  header {
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      linear-gradient(155deg, #101823 0%, #070b11 100%);
    border-bottom: 1px solid rgba(232,152,32,0.35);
    box-shadow: 0 1px 20px -4px rgba(232,152,32,0.25);
    padding: 22px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    -webkit-user-select: none;
  }

  header .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  header .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--navy);
    font-size: 18px;
  }

  header h1 {
    color: #fff;
    font-size: 19px;
    font-weight: 300;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header p {
    color: #b9c4d4;
    font-size: 12px;
    margin: 2px 0 0;
  }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .row-block {
    margin-bottom: 22px;
    border-radius: 14px;
    padding: 14px 16px 6px;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
      linear-gradient(155deg, #141c28 0%, #0b111a 100%);
    border: 1px solid var(--row-glow);
    box-shadow: 0 0 16px -2px var(--row-glow-soft), inset 0 0 24px rgba(0,0,0,0.45);
  }

  .row-block.row-planning { --row-glow: var(--glow-planning); --row-glow-soft: rgba(79,159,224,0.35); }
  .row-block.row-preparation { --row-glow: var(--glow-preparation); --row-glow-soft: rgba(47,196,196,0.35); }
  .row-block.row-execution { --row-glow: var(--glow-execution); --row-glow-soft: rgba(224,168,63,0.4); }
  .row-block.row-post { --row-glow: var(--glow-post); --row-glow-soft: rgba(154,166,181,0.3); }
  .row-block.row-safety { --row-glow: var(--glow-safety); --row-glow-soft: rgba(224,86,79,0.4); }

  .row-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--row-glow);
    margin: 0 0 10px 2px;
    text-shadow: 0 0 8px var(--row-glow-soft);
  }

  .tile-grid {
    display: flex;
    flex-wrap: wrap;
  }

  .tile {
    background: transparent;
    border: none;
    border-right: 1px solid rgba(255,255,255,0.22);
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
    text-align: left;
    flex: 1 1 220px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 200px;
  }

  .tile:last-child {
    border-right: none;
  }

  .tile:hover {
    background: rgba(255,255,255,0.035);
  }

  .tile:active {
    background: rgba(255,255,255,0.06);
  }

  .tile .tile-text {
    min-width: 0;
  }

  .tile .tile-icon {
    font-size: 30px;
    color: var(--row-glow);
    text-shadow: 0 0 8px var(--row-glow-soft), 0 0 16px var(--row-glow-soft);
    flex-shrink: 0;
    opacity: 0.95;
  }

  .tile h3 {
    font-size: 13.5px;
    font-weight: 500;
    margin: 0 0 3px;
    color: var(--row-glow);
    text-shadow: 0 0 6px var(--row-glow-soft);
  }

  .tile p {
    font-size: 11.5px;
    color: #8b96a6;
    margin: 0;
  }

  .tile.disabled {
    opacity: 0.6;
    cursor: default;
  }

  .tile.disabled:hover {
    background: transparent;
  }

  /* viewer overlay */
  #viewer {
    position: fixed;
    inset: 0;
    background: #fff;
    display: none;
    flex-direction: column;
    z-index: 40;
  }

  #viewer.open { display: flex; }

  #viewer .viewer-bar {
    background: var(--navy);
    color: #fff;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
  }

  #viewer .viewer-bar button {
    background: transparent;
    border: 1px solid #3a4d64;
    color: #fff;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  #viewer iframe {
    flex: 1;
    border: none;
    width: 100%;
  }

  #viewer .viewer-fallback {
    flex: 1;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    font-size: 14px;
  }

  #viewer .viewer-fallback a {
    color: var(--navy);
    background: var(--gold);
    padding: 8px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
  }

  /* admin */
  #admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 30, 53, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  #admin-overlay.open { display: flex; }

  #pin-box {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 260px;
    text-align: center;
  }

  #pin-box h2 {
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 14px;
    color: var(--navy);
  }

  #pin-box input {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.3em;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
  }

  #pin-box button, #admin-panel .primary {
    width: 100%;
    padding: 10px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
  }

  #pin-error {
    color: #a32d2d;
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }

  #admin-panel {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 640px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 22px 24px;
    display: none;
  }

  #admin-panel.open { display: block; }

  #admin-panel .admin-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  #admin-panel .admin-head h2 {
    font-size: 16px;
    font-weight: 500;
    color: var(--navy);
    margin: 0;
  }

  #admin-panel .admin-close {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--muted);
    cursor: pointer;
  }

  .admin-row-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 18px 0 8px;
  }

  .admin-tile-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .toggle {
    width: 38px;
    height: 21px;
    border-radius: 11px;
    background: var(--border);
    position: relative;
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .toggle.on { background: var(--gold); }

  .toggle .knob {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: left 0.15s ease;
  }

  .toggle.on .knob { left: 19px; }

  .admin-tile-row .name {
    font-size: 13px;
    font-weight: 500;
    flex: 0 0 150px;
    color: var(--ink);
  }

  .admin-tile-row input[type="text"] {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
  }

  .admin-tile-row input.icon-input {
    flex: 0 0 76px;
  }

  .icon-picker-btn {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 16px;
    color: var(--navy);
    cursor: pointer;
    position: relative;
  }

  .icon-picker-btn:hover {
    border-color: var(--gold);
  }

  .icon-popover {
    position: absolute;
    z-index: 60;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(13, 30, 53, 0.18);
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    width: 220px;
  }

  .icon-popover button {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    font-size: 16px;
    color: var(--navy);
    cursor: pointer;
  }

  .icon-popover button:hover {
    background: var(--row-preparation);
    border-color: var(--gold);
  }

  #admin-panel .save-bar {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }

  #admin-panel .save-bar button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
  }

  #admin-panel .save-bar .primary {
    background: var(--gold);
    border: none;
    color: var(--navy);
  }

  #admin-status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 16px;
  }

  .hub-footer {
    max-width: 1040px;
    margin: 20px auto 0;
    padding: 0 24px 30px;
  }

  .footer-rule {
    border: none;
    border-top: 1px solid var(--gold);
    opacity: 0.55;
    margin: 0 0 14px;
  }

  .footer-text {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--on-dark-faint);
    margin: 0;
  }
</style>
</head>
<body>

<header>
  <div class="brand" id="brand-trigger">
    <div class="brand-mark"><i class="ti ti-hexagon"></i></div>
    <div>
      <h1 id="hub-title">Shutdown Hub</h1>
      <p>Palm Crest Consultants</p>
    </div>
  </div>
</header>

<main id="rows-container"></main>

<div class="hub-footer">
  <hr class="footer-rule" />
  <p class="footer-text">Palmcrest Shutdown Hub</p>
</div>

<div id="viewer">
  <div class="viewer-bar">
    <span id="viewer-title">App</span>
    <button id="viewer-close">Close</button>
  </div>
  <iframe id="viewer-frame"></iframe>
  <div class="viewer-fallback" id="viewer-fallback">
    <p>This app can't be shown inline. Open it in a new tab instead.</p>
    <a id="viewer-fallback-link" href="#" target="_blank" rel="noopener">Open app</a>
  </div>
</div>

<div id="admin-overlay">
  <div id="pin-box">
    <h2>Enter admin PIN</h2>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="6" autocomplete="off" />
    <button id="pin-submit">Unlock</button>
    <p id="pin-error">Incorrect PIN</p>
  </div>

  <div id="admin-panel">
    <div class="admin-head">
      <h2>Hub admin</h2>
      <button class="admin-close" id="admin-close">&times;</button>
    </div>
    <div id="admin-rows"></div>
    <div class="save-bar">
      <button class="primary" id="admin-save">Save changes</button>
      <button id="admin-copy">Copy config.json</button>
    </div>
    <p id="admin-status"></p>
  </div>
</div>

<script>
  // ---- Config ----
  // Change this PIN before deploying to a client.
  const ADMIN_PIN = "1974";
  const STORAGE_KEY = "shutdownhub_config_" + location.pathname.replace(/\//g, "_");

  let config = null;

  function loadConfig() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { return Promise.resolve(JSON.parse(saved)); } catch (e) { /* fall through */ }
    }
    return fetch("config.json").then(r => r.json());
  }

  function iconFor(name) {
    return `<i class="ti ti-${name} tile-icon"></i>`;
  }

  function renderRows() {
    const container = document.getElementById("rows-container");
    container.innerHTML = "";
    config.rows.forEach(row => {
      const visibleTiles = row.tiles.filter(t => t.enabled);
      if (visibleTiles.length === 0) return;

      const block = document.createElement("div");
      block.className = `row-block row-${row.id}`;

      const label = document.createElement("p");
      label.className = "row-label";
      label.textContent = row.label;
      block.appendChild(label);

      const grid = document.createElement("div");
      grid.className = "tile-grid";

      visibleTiles.forEach(tile => {
        const el = document.createElement("button");
        el.className = "tile";
        el.innerHTML = `<div class="tile-text"><h3>${tile.title}</h3><p>${tile.subtitle}</p></div>${iconFor(tile.icon)}`;
        el.addEventListener("click", () => openTile(tile));
        grid.appendChild(el);
      });

      block.appendChild(grid);
      container.appendChild(block);
    });
  }

  function openTile(tile) {
    const viewer = document.getElementById("viewer");
    const frame = document.getElementById("viewer-frame");
    const fallback = document.getElementById("viewer-fallback");
    const fallbackLink = document.getElementById("viewer-fallback-link");
    document.getElementById("viewer-title").textContent = tile.title;

    if (!tile.url) {
      frame.style.display = "none";
      fallback.style.display = "flex";
      fallback.querySelector("p").textContent = "This tile doesn't have a link set up yet.";
      fallbackLink.style.display = "none";
    } else {
      frame.style.display = "block";
      fallback.style.display = "none";
      fallbackLink.style.display = "inline-block";
      fallbackLink.href = tile.url;
      frame.src = tile.url;
      frame.onerror = () => {
        frame.style.display = "none";
        fallback.style.display = "flex";
      };
    }
    viewer.classList.add("open");
  }

  document.getElementById("viewer-close").addEventListener("click", () => {
    document.getElementById("viewer").classList.remove("open");
    document.getElementById("viewer-frame").src = "about:blank";
  });

  // ---- Admin: 5-tap + PIN ----
  let tapCount = 0;
  let tapTimer = null;

  document.getElementById("brand-trigger").addEventListener("click", () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    if (tapCount >= 5) {
      tapCount = 0;
      document.getElementById("admin-overlay").classList.add("open");
      document.getElementById("pin-box").style.display = "block";
      document.getElementById("admin-panel").classList.remove("open");
      document.getElementById("pin-input").value = "";
      document.getElementById("pin-error").style.display = "none";
      document.getElementById("pin-input").focus();
    }
  });

  document.getElementById("pin-submit").addEventListener("click", checkPin);
  document.getElementById("pin-input").addEventListener("keydown", e => {
    if (e.key === "Enter") checkPin();
  });

  function checkPin() {
    const val = document.getElementById("pin-input").value;
    if (val === ADMIN_PIN) {
      document.getElementById("pin-box").style.display = "none";
      openAdminPanel();
    } else {
      document.getElementById("pin-error").style.display = "block";
    }
  }

  function openAdminPanel() {
    renderAdmin();
    document.getElementById("admin-panel").classList.add("open");
  }

  document.getElementById("admin-close").addEventListener("click", () => {
    document.getElementById("admin-overlay").classList.remove("open");
  });

  function renderAdmin() {
    const wrap = document.getElementById("admin-rows");
    wrap.innerHTML = "";
    config.rows.forEach(row => {
      const label = document.createElement("p");
      label.className = "admin-row-label";
      label.textContent = row.label;
      wrap.appendChild(label);

      row.tiles.forEach(tile => {
        const r = document.createElement("div");
        r.className = "admin-tile-row";
        r.innerHTML = `
          <div class="toggle ${tile.enabled ? "on" : ""}" data-row="${row.id}" data-tile="${tile.id}"><div class="knob"></div></div>
          <span class="name">${tile.title}</span>
          <button type="button" class="icon-picker-btn" data-row="${row.id}" data-tile="${tile.id}" data-icon="${tile.icon}" title="Change icon"><i class="ti ti-${tile.icon}"></i></button>
          <input type="text" placeholder="App link (URL)" value="${tile.url}" data-row="${row.id}" data-tile="${tile.id}" />
        `;
        wrap.appendChild(r);
      });
    });

    wrap.querySelectorAll(".toggle").forEach(t => {
      t.addEventListener("click", () => {
        t.classList.toggle("on");
      });
    });

    wrap.querySelectorAll(".icon-picker-btn").forEach(btn => {
      btn.addEventListener("click", e => openIconPicker(e.currentTarget));
    });
  }

  const ICON_CHOICES = [
    "folder", "sitemap", "clipboard-check", "map", "chart-bar", "activity",
    "message-circle", "file-check", "alert-triangle", "shield-check",
    "calendar", "clock", "list-check", "report", "database", "cloud",
    "users", "user", "settings", "tool", "bell", "checklist",
    "file-text", "files", "gauge", "chart-line", "chart-pie",
    "flag", "target", "bookmark", "layout-grid", "clipboard-list",
    "phone", "mail", "help-circle", "info-circle"
  ];

  let openPopover = null;

  function closeIconPicker() {
    if (openPopover) { openPopover.remove(); openPopover = null; }
    document.removeEventListener("click", handleOutsideClick, true);
  }

  function handleOutsideClick(e) {
    if (openPopover && !openPopover.contains(e.target) && !e.target.closest(".icon-picker-btn")) {
      closeIconPicker();
    }
  }

  function openIconPicker(btn) {
    if (openPopover) { closeIconPicker(); return; }

    const pop = document.createElement("div");
    pop.className = "icon-popover";
    ICON_CHOICES.forEach(name => {
      const opt = document.createElement("button");
      opt.type = "button";
      opt.innerHTML = `<i class="ti ti-${name}"></i>`;
      opt.title = name;
      opt.addEventListener("click", () => {
        btn.dataset.icon = name;
        btn.innerHTML = `<i class="ti ti-${name}"></i>`;
        closeIconPicker();
      });
      pop.appendChild(opt);
    });

    document.body.appendChild(pop);
    const rect = btn.getBoundingClientRect();
    pop.style.top = `${window.scrollY + rect.bottom + 6}px`;
    pop.style.left = `${window.scrollX + rect.left}px`;
    openPopover = pop;

    setTimeout(() => document.addEventListener("click", handleOutsideClick, true), 0);
  }

  function collectAdminChanges() {
    document.querySelectorAll(".admin-tile-row").forEach(rowEl => {
      const toggle = rowEl.querySelector(".toggle");
      const iconBtn = rowEl.querySelector(".icon-picker-btn");
      const urlInput = rowEl.querySelector('input[type="text"]');
      const rowId = toggle.dataset.row;
      const tileId = toggle.dataset.tile;
      const row = config.rows.find(r => r.id === rowId);
      const tile = row.tiles.find(t => t.id === tileId);
      tile.enabled = toggle.classList.contains("on");
      tile.icon = iconBtn.dataset.icon;
      tile.url = urlInput.value.trim();
    });
  }

  document.getElementById("admin-save").addEventListener("click", () => {
    collectAdminChanges();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    renderRows();
    document.getElementById("admin-status").textContent = "Saved to this browser. Use \"Copy config.json\" to push these changes to GitHub for all users.";
  });

  document.getElementById("admin-copy").addEventListener("click", () => {
    collectAdminChanges();
    const text = JSON.stringify(config, null, 2);
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById("admin-status").textContent = "config.json copied to clipboard. Paste it into the GitHub file to update the live hub.";
    }).catch(() => {
      document.getElementById("admin-status").textContent = "Couldn't copy automatically — select and copy the JSON manually.";
    });
  });

  // ---- init ----
  loadConfig().then(cfg => {
    config = cfg;
    renderRows();
  });
</script>

</body>
</html>
